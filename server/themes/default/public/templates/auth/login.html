<div ng-if="loading" class="loading">
  <i class="fa fa-spinner fa-spin"></i>
</div>

<div class="alert {{loginMessage.type}} alert-dismissible alert-fixed" role="alert" ng-if="loginMessage.show">
  <strong>{{loginMessage.text}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" ng-click="loginMessage.show = false"></button>
</div>

<div class="row justify-content-center pt-4">
  <div class="col-xs-12">
    <h4 class="ps-3">Login</h4>
    <hr />
  </div>

  <div class="col-xs-12 col-md-8">
    <form ng-submit="loginSubmit()" name="login">
      <input class="form-control mb-3" type="text" name="user.username" ng-model="user.username" placeholder="Username" required>
      <input class="form-control mb-3" type="password" name="user.password" ng-model="user.password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary btn-lg">Login</button>
    </form>
  </div>
</div>
