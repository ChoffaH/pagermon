<div ng-if="loading" class="loading">
  <i class="fa fa-spinner fa-spin"></i>
</div>


<div class="alert {{alertMessage.type}} alert-dismissible alert-fixed" role="alert" ng-if="alertMessage.show">
  <strong>{{alertMessage.text}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" ng-click="alertMessage.show = false"></button>
</div>

<div class="row justify-content-center pt-4">
  <div>
    <h3 class="ps-3">
      <a href="/admin/">Admin</a> / Users
    </h3>
    <hr />
  </div>

  <div class="d-flex justify-content-between align-items-center ms-1 me-1 mb-2">
    <div class="me-2 w-50">
      <div class="input-group">
        <span class="input-group-text me-2">
          <i class="fa fa-filter"></i>
        </span>
        <input type="text" class="form-control" name="search" placeholder="Filter" ng-model="search">
      </div>
    </div>

    <div>
      <button type="button" class="btn btn-sm btn-outline-success" ng-click="userDetail('new');">
        <i class="fa fa-plus"></i>
        <span class="d-none d-sm-inline-block">Add</span>
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" ng-disabled="!userSelected()" ng-click="userDelete()">
        <i class="fa fa-trash-alt"></i>
        <span class="d-none d-sm-inline-block">Delete</span>
      </button>
    </div>
  </div>
</div>

<div class="row position-relative overflow-auto ms-1 me-1">
  <table class="table table-sm table-hover table-striped">
    <thead>
      <tr>
        <th></th>
        <th class="text-secondary">ID</th>
        <th class="text-secondary">Username</th>
        <th class="text-secondary">Given Name</th>
        <th class="text-secondary">Surname</th>
        <th class="text-secondary">Email</th>
        <th class="text-secondary">Role</th>
        <th class="text-secondary">Status</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="user in users | filter: search" ng-click="userDetail(user.id);" class="cursor-pointer">
        <td class="text-nowrap align-middle">
          <input type="checkbox" class="form-check-input" ng-model="user.selected" ng-click="$event.stopPropagation()" />
        </td>
        <td class="text-primary align-middle">
          <span style="font-family: monospace;"><strong>{{user.id}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle" >
          <span style="font-family: monospace;"><strong>{{user.username}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle">
          <span style="font-family: monospace;"><strong>{{user.givenname}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle">
          <span style="font-family: monospace;"><strong>{{user.surname}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle">
          <span style="font-family: monospace;"><strong>{{user.email}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle">
          <span style="font-family: monospace;"><strong>{{user.role}}</strong></span>
        </td>
        <td class="text-primary text-nowrap align-middle">
          <span style="font-family: monospace;"><strong>{{user.status}}</strong></span>
        </td>
    </tbody>
  </table>
</div>
