<div ng-if="loading" class="loading">
  <i class="fa fa-spinner fa-spin"></i>
</div>

<div class="alert {{alertMessage.type}} alert-dismissible alert-fixed" role="alert" ng-if="alertMessage.show">
  <strong>{{alertMessage.text}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" ng-click="alertMessage.show = false"></button>
</div>

<div class="row justify-content-center pt-4">
  <div>
    <h4 class="ps-3">
      <a href="/admin/">Admin</a> / <a href="/admin/users/">Users</a> / {{user.username || 'New'}}
    </h4>
    <hr />
  </div>
  
  <div class="col-xs-12">
    <form ng-submit="userSubmit()" class="form-horizontal" name="user">
      <h5>User Details</h5>

      <div class="row g-3 justify-content-end align-items-center" ng-class="!user.username || existingUsername ? 'has-error' : 'has-success'">
        <div class="col-3 col-sm-2">
          <label for="user.username" class="float-end">Username</label>
        </div>
        <div class="col-9 col-sm-10">
          <input class="form-control" type="text" name="user.username" ng-model="user.username" ng-change="checkUsername()" ng-model-options="{updateOn: 'blur'}" required>
        </div>
      </div>
      <div class="row g-3 justify-content-end mb-3">
        <div class="col-9 col-sm-10">
          <span class="form-text">Required</span>
          <span ng-if="existingUsername" class="form-text text-danger">Username already exists!</span>
          <i ng-if="userLoading" class="fa fa-refresh fa-spin fa-2x fa-fw" aria-hidden="true"></i>
        </div>
      </div>

      <div class="row g-3 justify-content-end align-items-center" ng-class="!user.givenname ? 'has-error' : 'has-success'">
        <div class="col-3 col-sm-2">
          <label for="user.givenname" class="float-end">Given Name</label>
        </div>
        <div class="col-9 col-sm-10">
          <input class="form-control" type="text" name="user.givenname" ng-model="user.givenname" required>
        </div>
      </div>
      <div class="row g-3 justify-content-end mb-3">
        <div class="col-9 col-sm-10">
          <span class="form-text">Required</span>
        </div>
      </div>

      <div class="row g-3 justify-content-end align-items-center mb-3">
        <div class="col-3 col-sm-2">
          <label for="user.surname" class="float-end">Surname</label>
        </div>
        <div class="col-9 col-sm-10">
          <input class="form-control" type="text" name="user.surname" ng-model="user.surname">
        </div>
      </div>

      <div class="row g-3 justify-content-end align-items-center" ng-class="!user.email || existingEmail ? 'has-error' : 'has-success'">
        <div class="col-3 col-sm-2">
          <label for="user.email" class="float-end">Email Address</label>
        </div>
        <div class="col-9 col-sm-10">
          <input class="form-control" type="email" name="user.email" ng-model="user.email" ng-change="checkEmail()" ng-model-options="{updateOn: 'blur'}" required>
        </div>
      </div>
      <div class="row g-3 justify-content-end mb-3">
        <div class="col-9 col-sm-10">
          <span class="form-text">Required</span>
          <span ng-if="existingUsername" class="form-text text-danger">Email already exists!</span>
          <i ng-if="userLoading" class="fa fa-refresh fa-spin fa-2x fa-fw" aria-hidden="true"></i>
        </div>
      </div>

      <div ng-if="isNew">
        <div class="row g-3 justify-content-end align-items-center" ng-class="!user.password ? 'has-error' : 'has-success'">
          <div class="col-3 col-sm-2">
            <label for="user.password" class="float-end">Password</label>
          </div>
          <div class="col-9 col-sm-10">
            <input class="form-control" type="password" name="user.password" ng-model="user.password" required>
          </div>
        </div>
        <div class="row g-3 justify-content-end mb-3">
          <div class="col-9 col-sm-10">
            <span class="form-text">Required</span>
          </div>
        </div>
      </div>

      <div class="row g-3 justify-content-end align-items-center mb-3">
        <div class="col-3 col-sm-2">
          <label for="user.role" class="float-end">User Role</label>
        </div>
        <div class="col-9 col-sm-10">
          <select name="user.role" ng-model="user.role" class="form-control">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>

      <div class="row g-3 justify-content-end align-items-center mb-3">
        <div class="col-3 col-sm-2">
          <label for="user.status" class="float-end">User Status</label>
        </div>
        <div class="col-9 col-sm-10">
          <select name="user.status" ng-model="user.status" class="form-control">
            <option value="active">Active</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
      </div>

      <div ng-if="!isNew">
        <div class="row g-3 justify-content-end align-items-center">
          <div class="col-3 col-sm-2">
            <label for="user.lastlogondate" class="float-end">Last Logon Date</label>
          </div>
          <div class="col-9 col-sm-10">
            <input class="form-control" type="text" name="user.lastlogondate" ng-model="user.lastlogondate" readonly>
          </div>
        </div>
        <div class="row g-3 justify-content-end mb-3">
          <div class="col-9 col-sm-10">
            <span class="form-text">Last Logon Date for user</span>
          </div>
        </div>
      </div>

      <div class="btn-group-vertical">
        <button type="button" ng-if="!isNew" ng-click="userDelete()" class="btn btn-danger">
          <i class="fa fa-trash"></i>
          <span class="d-none d-sm-inline-block">Delete</span>
        </button>
        <button type="button" ng-if="!isNew" ng-click="userReset()" class="btn btn-warning ">
          <i class="fa fa-unlock"></i>
          <span class="d-none d-sm-inline-block">Reset Password</span>
        </button>
        <button type="submit" class="btn btn-success">
          <i class="fa fa-save"></i>
          <span class="d-none d-sm-inline-block">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
