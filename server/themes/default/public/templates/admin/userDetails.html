<div ng-if="loading" class="loading">
  <i class="fa fa-spinner fa-spin"></i>
</div>

<div class="alert {{alertMessage.type}} alert-dismissible alert-fixed" role="alert" ng-if="alertMessage.show">
  <strong>{{alertMessage.text}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" ng-click="alertMessage.show = false"></button>
</div>

<div class="row justify-content-center pt-4">
  <div>
    <h3 class="ps-3">
      <a href="/admin/">Admin</a> / <a href="/admin/users/">Users</a> / {{user.username || 'New'}}
    </h3>
    <hr />
  </div>
  
  <div class="col-xs-12">
    <form name="user">
      <div class="d-flex justify-content-between">
        <h4 class="my-auto">User Details</h4>
  
        <div>
          <button type="button" class="btn btn-sm btn-danger" ng-if="!isNew" ng-click="userDelete()">
            <i class="fa fa-trash"></i> Delete
          </button>
          <button type="button" class="btn btn-sm btn-warning" ng-if="!isNew" ng-click="userReset()">
            <i class="fa fa-unlock"></i> Reset Password
          </button>
          <button type="submit" class="btn btn-sm btn-success" ng-click="userSubmit()">
            <i class="fa fa-save"></i> Save
          </button>
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.username" class="col-sm-2 col-form-label">Username</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" name="user.username" ng-class="{'is-invalid':!user.username || existingUsername}"
            ng-model="user.username" ng-change="checkUsername()" ng-model-options="{updateOn: 'blur'}" required>
          <span class="form-text">Required</span>
          <span class="form-text text-danger" ng-if="existingUsername">Username already exists!</span>
          <i class="fa fa-refresh fa-spin fa-2x fa-fw" ng-if="userLoading" aria-hidden="true"></i>
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.givenname" class="col-sm-2 col-form-label">Given Name</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" name="user.givenname" ng-class="{'is-invalid':!user.givenname}" ng-model="user.givenname" required>
          <span class="form-text">Required</span>
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.surname" class="col-sm-2 col-form-label">Surname</label>
        <div class="col-sm-10">
          <input class="form-control" type="text" name="user.surname" ng-model="user.surname">
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.email" class="col-sm-2 col-form-label">Email Address</label>
        <div class="col-sm-10">
          <input class="form-control" type="email" name="user.email" ng-class="{'is-invalid':!user.email || existingEmail}"
            ng-model="user.email" ng-change="checkEmail()" ng-model-options="{updateOn: 'blur'}" required>
          <span class="form-text">Required</span>
          <span class="form-text text-danger" ng-if="existingUsername">Email already exists!</span>
          <i class="fa fa-refresh fa-spin fa-2x fa-fw" ng-if="userLoading" aria-hidden="true"></i>
        </div>
      </div>

      <div class="row mb-3" ng-if="isNew">
        <label for="user.password" class="col-sm-2 col-form-label">Password</label>
        <div class="col-sm-10">
          <input type="password" class="form-control" name="user.password" ng-class="{'is-invalid':!user.password}" ng-model="user.password" required>
          <span class="form-text">Required</span>
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.role" class="col-sm-2 col-form-label">User Role</label>
        <div class="col-sm-10">
          <select name="user.role" ng-model="user.role" class="form-control">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <label for="user.status" class="col-sm-2 col-form-label">User Status</label>
        <div class="col-sm-10">
          <select name="user.status" ng-model="user.status" class="form-control">
            <option value="active">Active</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
      </div>

      <div class="row mb-3" ng-if="!isNew">
        <label for="user.lastlogondate" class="col-sm-2 col-form-label">Last Logon Date</label>
        <div class="col-sm-10">
          <input class="form-control" type="text" name="user.lastlogondate" ng-model="user.lastlogondate" readonly>
          <span class="form-text">Last Logon Date for user</span>
        </div>
      </div>
    </form>
  </div>
</div>
